name: 📦 Build APK Android

# ─────────────────────────────────────────────────────────────
# Compile automatiquement l'APK du Métronome à chaque push.
#   • push sur main/master  → artefact téléchargeable
#   • tag v*                → artefact + Release GitHub publique
#   • manuel (workflow_dispatch) → bouton « Run workflow »
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Nécessaire pour publier une Release sur les tags
permissions:
  contents: write

jobs:
  apk:
    name: Compiler l'APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ⚙️ Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 7 / AGP 8.13 compilent en Java 21 (voir app/build.gradle)
      - name: ☕ Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 🤖 Gradle + cache
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Installer les dépendances
        run: npm ci

      - name: 🌐 Compiler le web → dist/
        run: npm run build

      # Recrée android/app/src/main/assets/public + capacitor.config.json
      # (ces fichiers sont ignorés par git, ils sont donc toujours régénérés)
      - name: 📲 Copier le web dans le projet Android
        run: node scripts/sync-android.mjs

      - name: 🔧 Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: 🏗️ Assembler l'APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📏 Vérifier la sortie
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: 📦 Déposer l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: Metronome-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Un tag « v1.0.0 » déclenche aussi une Release publique avec l'APK
      - name: 🏷️ Publier la Release (tags v* uniquement)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "Métronome $GITHUB_REF_NAME" \
              --generate-notes
          fi

